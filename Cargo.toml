[package]
name = "host-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pushes a host's metrics to Prometheus and its logs to Loki"
license = "MIT"
publish = false

# Parts a host may go without, for a smaller binary: a configuration
# with a component of a part left out is refused.
[features]
default = [
    "docker",
    "filesystems",
    "journal",
    "journal-files",
    "otlp",
    "server",
    "snmp",
    "syslog",
]
# loki.source.file's `decompression`: gzip, zlib, bzip2 (pure Rust).
decompression = ["dep:flate2", "dep:bzip2-rs"]
docker = []
# loki.source.file's `encoding` beyond UTF-8, UTF-16 and Latin-1: the
# WHATWG encodings (encoding_rs, +~0.5 MB of tables).
encodings = ["dep:encoding_rs"]
filesystems = []
journal = []
# The journal read from its files instead of through journalctl, which
# a container from scratch lacks.
journal-files = ["journal", "dep:lz4_flex", "dep:ruzstd"]
# Fields journald compressed with xz, its default before systemd 246.
journal-xz = ["journal-files", "dep:lzma-rs"]
otlp = []
# Alloy's HTTP server: a status page, the agent's own metrics, health,
# reload and live views of what is sent.
server = []
snmp = []
syslog = []
# SNMP devices polled by tasks on one thread instead of a thread each.
tokio = ["snmp", "dep:tokio"]
# HTTPS for scrapes and pushes, and syslog over TLS (its listeners'
# tls_config): rustls on ring, +~0.9 MB; ring also signs google_iam's
# service account tokens.
tls = ["dep:rustls", "dep:ring"]
# HTTP/2 over TLS where the server picks it by ALPN (enable_http2):
# h2 on a tokio runtime per sending thread.
http2 = [
    "tls",
    "dep:bytes",
    "dep:h2",
    "dep:http",
    "dep:tokio",
    "dep:tokio-rustls",
    "tokio/io-util",
]
# encoding.from_yaml (yaml-rust2, pure Rust).
yaml = ["dep:yaml-rust2"]
# Azure certificates in PKCS #12 (p12-keystore, with x509-parser).
pkcs12 = ["tls", "dep:p12-keystore"]

[dependencies]
bytes = { version = "1", optional = true }
bzip2-rs = { version = "0.1", optional = true }
encoding_rs = { version = "0.8", optional = true }
flate2 = { version = "1", optional = true, default-features = false, features = [
    "rust_backend",
] }
h2 = { version = "0.4", optional = true }
hmac = { version = "0.13", default-features = false }
http = { version = "1", optional = true }
libc = "0.2"
lz4_flex = { version = "0.14", optional = true, default-features = false, features = [
    "safe-decode",
] }
lzma-rs = { version = "0.3", optional = true }
p12-keystore = { version = "0.4", optional = true }
regex-lite = "0.1"
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
ruzstd = { version = "0.9", optional = true }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.11", default-features = false }
snap = "1"
tokio = { version = "1", optional = true, default-features = false, features = [
    "net",
    "rt",
    "time",
] }
tokio-rustls = { version = "0.26", optional = true, default-features = false }
yaml-rust2 = { version = "0.13.0", default-features = false, optional = true }

# Small and lean: an agent on every host, idle between rounds, so size
# and memory count, speed does not.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
